<html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Login & Registration</title>
<head>
    <script>
        function HandleRegResponse(response) {
            // Parse the JSON response
			//document.getElementById("textResponse").innerHTML = "Success: " + response.message;			
            var parsedResponse = JSON.parse(response);

            // Check for success or error and display the appropriate message
             if (parsedResponse.success) {
                 document.getElementById("textResponse").innerHTML = "Success: " + parsedResponse.message;
             } else {
                 document.getElementById("textResponse").innerHTML = "Error: " + parsedResponse.message;
             }
        }
        function HandleLoginResponse(response) {		
            var userPassword = document.getElementById("loginPassword").value;
            var userUsername = document.getElementById("loginUsername").value;
            var parsedResponse = JSON.parse(response);

            if (parsedResponse.success) {
                // Password returned from the database
                if (parsedResponse.password === userPassword) {
                    console.log("made it");
                    // Password matches, now generate the session token
                    generateSessionToken(userUsername);
                } else {
                    document.getElementById("textResponse").innerHTML = "Error: Username or password not found.";
                }
            } else {
                document.getElementById("textResponse").innerHTML = "Error: " + parsedResponse.message;
            }
        }

        // Function to generate a session token after login
        function generateSessionToken(username) {
            var request = new XMLHttpRequest();
            request.open("POST", "generateToken.php", true);
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            console.log("made it2");

            request.onreadystatechange = function () {
                

                if (this.readyState == 4 && this.status == 200) {

                    var tokenResponse = JSON.parse(this.responseText);
                    if (tokenResponse.success) {
                        console.log(tokenResponse);
                        // Store the session token and expiry in localStorage
                        localStorage.setItem('username', tokenResponse.username);
                        localStorage.setItem('session_token', tokenResponse.session_token);
                        localStorage.setItem('token_expiry', tokenResponse.token_expiry);
                        localStorage.setItem('email', tokenResponse.email);
                        localStorage.setItem('location', tokenResponse.location);
                        localStorage.setItem('jobTitle', tokenResponse.jobTitle);
                        localStorage.setItem('alerts', tokenResponse.alerts);
                
                        // Set a flag to indicate that this is the first login load
                        localStorage.setItem('firstLoad', 'true');
                        
                        console.log("got here");
                        window.location.href = "homepage.html";
                    } else {
                        document.getElementById("textResponse").innerHTML = "Error: " + tokenResponse.message;
                    }
                }
            };

            // Send the username to generate the token
            request.send("uname=" + username);
        }

        function validateRegisterFields(username, email, jobTitle, location, password) {
            var missingFields = [];
            if (!username) missingFields.push("Username");
            if (!email) missingFields.push("Email");
            if (!jobTitle) missingFields.push("Job Title");
            if (!location) missingFields.push("Location");
            if (!password) missingFields.push("Password");

            if (missingFields.length > 0) {
                document.getElementById("textResponse").innerHTML = "Error: Missing fields - " + missingFields.join(", ");
                return false;
            }
            return true;
        }

        // Function to validate login fields
        function validateLoginFields(username, password) {
            if (!username || !password) {
                document.getElementById("textResponse").innerHTML = "Error: Username and Password are required.";
                return false;
            }
            return true;
        }


        function SendRegRequest(username, password, email, jobTitle, location) {
            if (!validateRegisterFields(username, email, jobTitle, location, password)) return;
            var request = new XMLHttpRequest();
            request.open("POST", "register.php", true);
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            // Log the values being sent
            console.log("Sending request: ", "uname=" + username + "&pword=" + password + "email=" + email + "title=" + jobTitle + "location=" + location);

            request.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Response received: ", this.responseText); // Log the response
                    HandleRegResponse(this.responseText);
                }
            };

            // Send the username and password
            request.send("uname=" + username + "&pword=" + password + "&email=" + email + "&jobTitle=" + jobTitle + "&location=" + location);
        }

        function SendLoginRequest(username, password) {
            if (!validateLoginFields(username, password)) return;
            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            // Log the values being sent
            console.log("Sending request: ", "uname=" + username + "&pword=" + password);
            document.getElementById("textResponse").innerHTML = "Loading";
            request.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Response received: ", this.responseText); // Log the response
                    HandleLoginResponse(this.responseText);
                }
            };
            // Send the username and password
            request.send("uname=" + username + "&pword=" + password);
        }

        function toggleForm(formId) {
            var loginForm = document.getElementById("loginForm");
            var registerForm = document.getElementById("registerForm");
            
            if (formId === 'loginForm') {
                loginForm.style.display = "block";
                registerForm.style.display = "none";
            } else if (formId === 'registerForm') {
                loginForm.style.display = "none";
                registerForm.style.display = "block";
            }
        }

        function login() {
            var username = document.getElementById("loginUsername").value;
            var password = document.getElementById("loginPassword").value;
            SendLoginRequest(username, password);
        }

        function register() {
            var username = document.getElementById("registerUsername").value;
            var email = document.getElementById("registerEmail").value;
            var jobTitle = document.getElementById("registerJobTitle").value;
            var location = document.getElementById("registerLocation").value;
            var password = document.getElementById("registerPassword").value;
            SendRegRequest(username, password, email, jobTitle, location);
        }



        function validateSession() {
            var sessionToken = localStorage.getItem('session_token');
            
            if (!sessionToken) {
                console.log("No session token found. Please log in.");
                resetPage();
                return;
            }

            var request = new XMLHttpRequest();
            request.open("POST", "validateSession.php", true);  // This file will handle session validation
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            request.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var response = JSON.parse(this.responseText);
                    if (response.success) {
                        // Session is active
                        document.body.innerHTML += "<p>Session is active.</p>";
                    } else {
                        // Session is invalid, logout and reset page
                        console.log("Session invalid: ", response.message);
                    }
                }
            };

            // Send the session token to validate
            request.send("session_token=" + sessionToken);
        }


        function resetPage() {
            document.getElementById('loginForm').style.display = "none";
            document.getElementById('registerForm').style.display = "none";
            document.getElementById('textResponse').innerHTML = "awaiting response";
            document.getElementById('logoutButton').style.display = "none"; // Hide logout button
            document.getElementById('validateSessionButton').style.display = "none"; // Hide validate session button
            document.getElementById('welcomeMessage').style.display = "none"; // Hide welcome message
        }

        //             <button onclick="register()">Submit</button>
        //         </div>
        //         <div id="textResponse">
        //             awaiting response
        //         </div>
        //     `;
        // }



        function logout() {
            // var username = localStorage.getItem('username');
            var sessionToken = localStorage.getItem('session_token');

            if (!sessionToken) {
                console.log("No user logged in.");
                return;
            }

            var request = new XMLHttpRequest();
            request.open("POST", "logout.php", true);
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            request.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var response = JSON.parse(this.responseText);
                    if (response.success) {
                        console.log("Logout successful: ", response.message);
                        console.log("session_token=" + sessionToken);

                        // Clear the session token and username from localStorage
                        localStorage.removeItem('session_token');
                        localStorage.removeItem('username');
                        resetPage();

                    } else {
                        console.log("Logout failed: ", response.message);
                    }
                }
            };

            request.send("session_token=" + sessionToken);
        }




            





    </script>
</head>

<body>
    <h1>Login & Registration Page</h1>

    
    <div class="button-container">
        <button onclick="toggleForm('loginForm')" class="toggle-btn">Login</button>
        <button onclick="toggleForm('registerForm')" class="toggle-btn">Register</button>
    </div>

    <div id="loginForm" class="form-container" style="display:none;">
        <h2>Login</h2>
        <input type="text" id="loginUsername" placeholder="Username"><br>
        <input type="password" id="loginPassword" placeholder="Password"><br>
        <div class="button-wrapper">
            <button onclick="login()" class="submit-btn">Submit</button>
        </div>
    </div>

    <div id="registerForm" class="form-container" style="display:none;">
        <h2>Register</h2>
        <input type="text" id="registerUsername" placeholder="Username"><br>
        <input type="email" id="registerEmail" placeholder="Email"><br>
        <input type="text" id="registerJobTitle" placeholder="Job Title"><br>
        <input type="text" id="registerLocation" placeholder="Preferred Location"><br>
        <input type="password" id="registerPassword" placeholder="Password"><br>
        <div class="button-wrapper">
            <button onclick="register()" class="submit-btn">Submit</button>
        </div>
    </div>

    <div id="textResponse">
        
    </div>
</body>

</html>
