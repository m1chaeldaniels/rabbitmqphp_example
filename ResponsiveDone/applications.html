    <main class="container my-5">
        <section class="custom-card p-4 rounded-4 shadow-lg text-light">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        function fetchApplications() {
            var username = localStorage.getItem('username');
            var request = new XMLHttpRequest();
            request.open("POST", "fetch_applications.php", true);
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            request.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    var data = JSON.parse(this.responseText);
                    const container = document.getElementById('applications');
                    container.innerHTML = '';

                    if (data.success) {
                        console.log(data);
                        console.log("data.jobs" + data.jobs);
                        console.log("data.applied_jobs" + data.applied_jobs);

                        data.applied_jobs.forEach(app => {
                            container.innerHTML += `
                                <div>
                                    <h3>${app.title}</h3>
                                    <p><strong>Company:</strong> ${app.company}</p>
                                    <p><strong>Date:</strong> ${app.applied_at}</p>
                                    <a href="${app.url}" target="_blank">View Job</a>
                                </div>
                            `;
                        });
                    } else {
                        container.innerHTML = '<p>No applications found.</p>';
                    }
                }
            };
            request.send(`username=${username}`);
        }
// need to add logout function and token function
        fetchApplications();
    </script>
