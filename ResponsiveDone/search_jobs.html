    <main class="container my-5">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
        var sessionToken = localStorage.getItem('session_token');
        if (!sessionToken) {
            
            window.location.href = 'index.html';
        } else {
            // Validate the session token
            var request = new XMLHttpRequest();
            request.open('POST', 'validateSession.php', true);
            request.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            request.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    var response = JSON.parse(this.responseText);
                    if (!response.success) {
                        // If the token is invalid, redirect to the login page
                        window.location.href = 'index.html';
                    }
                }
            };
            request.send('session_token=' + sessionToken);
        }
        });
        // this is where variables for filters are set subject to change lmk
        // let jobTitle = '';
        // let location = '';
        function searchJobs() {
            var title = document.getElementById("jobTitle").value;
            var location = document.getElementById("location").value;
            SendJobSearch(title, location);
        }
        
        function SendJobSearch(title, location) {
            var request = new XMLHttpRequest();
            request.open("POST", "jobsearch.php", true);
            request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            
            console.log("Sending request: ", "title=" + title + "&location=" + location);

            request.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Response received: ", this.responseText); 
                    jobSearchResponse(this.responseText);
                }
            };

            request.send("title=" + title + "&location=" + location);         
            
            // const searchResults = document.getElementById('searchResults');
            // searchResults.innerHTML = `
            //     <h2>Search Criteria:</h2>
            //     <p><strong>Job Title:</strong> ${jobTitle || 'N/A'}</p>
            //     <p><strong>Location:</strong> ${location || 'N/A'}</p>
               
            // `;
        }
        function jobSearchResponse(response) {			
            var data = JSON.parse(response);
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = ''; 

        if (data.success && data.jobs.length > 0) {
            data.jobs.forEach(job => {
                const jobDiv = document.createElement('div');
                jobDiv.classList.add('job');

                
                const title = document.createElement('h3');
                title.textContent = job.title;
                jobDiv.appendChild(title);

                
                const company = document.createElement('p');
                company.innerHTML = `<strong>Company:</strong> ${job.company}`;
                jobDiv.appendChild(company);

              
                const location = document.createElement('p');
                location.innerHTML = `<strong>Location:</strong> ${job.locations}`;
                jobDiv.appendChild(location);

              
                const description = document.createElement('p');
                description.innerHTML = `<strong>Description:</strong> ${job.description}`;
                jobDiv.appendChild(description);

                console.log("Job ID for this job:", job.id);

                
                const link = document.createElement('a');
                link.href = job.url;
                link.target = '_blank';
                link.textContent = 'Apply Here';
                jobDiv.appendChild(link);

                // new section for apply deliverable
                const appliedSection = document.createElement('div');
                appliedSection.classList.add('applied-prompt');
                appliedSection.style.display = 'none'; // Initially hidden
                appliedSection.innerHTML = `
                    <p>Did you apply to this job?</p>
                    <button onclick="saveApplication('${job.id}', this)">Yes</button>
                    <button onclick="hideAppliedPrompt(this)">No</button>
                `;

                jobDiv.appendChild(appliedSection);

                // Add click event listener for 'Apply Here'
                link.addEventListener('click', function (e) {
                    e.preventDefault(); // Open in new tab but allow JS execution
                    window.open(job.url, '_blank'); // Open the link
                    appliedSection.style.display = 'block'; // Show applied prompt
                });






                searchResults.appendChild(jobDiv);
            });
        } else {
            searchResults.innerHTML = '<p>No jobs found. Please try again.</p>';
        }
    }

    function saveApplication(id, button) {
    const dateApplied = new Date().toISOString().slice(0, 10); // Current date (YYYY-MM-DD)
    const username = localStorage.getItem('username'); // Assume user is logged in

    var request = new XMLHttpRequest();
    request.open("POST", "save_application.php", true);
    request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

    request.onreadystatechange = function () {
        if (this.readyState == 4 && this.status == 200) {
            var response = JSON.parse(this.responseText);
            console.log("Response received: ", response.message);
            alert(response.message);

            // Hide the applied prompt
            hideAppliedPrompt(button);
        }
    };
    console.log("id=" + id +"user" + username);
    request.send("username=" + username + "&id=" + id);
    }
    function hideAppliedPrompt(button) {
    // Find the parent 'applied-prompt' div and hide it
    const appliedPrompt = button.closest('.applied-prompt');
    if (appliedPrompt) {
        appliedPrompt.style.display = 'none';
    }
    }



    function logout() {
        var sessionToken = localStorage.getItem('session_token');

        if (!sessionToken) {
            console.log("No user logged in.");
            return;
        }

        var request = new XMLHttpRequest();
        request.open("POST", "logout.php", true);
        request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

        request.onreadystatechange = function () {
            if (this.readyState == 4 && this.status == 200) {
                var response = JSON.parse(this.responseText);
                if (response.success) {
                    console.log("Logout successful: ", response.message);

                   
                    localStorage.removeItem('session_token');
                    localStorage.removeItem('username');
                    localStorage.removeItem('email');
                    localStorage.removeItem('location');
                    localStorage.removeItem('jobTitle');

                    window.location.href = "index.html";
                } else {
                    console.log("Logout failed: ", response.message);
                }
            }
        };

        request.send("session_token=" + sessionToken);
    }
    </script>
