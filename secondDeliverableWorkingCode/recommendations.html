<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Recommendations</title>
    <link rel="stylesheet" href="recommendations.css">
</head>

<body>
    
    <header>
        <div class="logo">
            <h1>RMMY</h1>
        </div>
        <nav>
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="search_jobs.html">Search Jobs</a></li>
                <li><a href="companies.html">Research Companies</a></li>
                <li><a href="recommendations.html">Recommendations</a></li>
                <li><a href="#" onclick="toggleAlertsPopup()">Alerts</a></li>
                <li><a href="#">Logout</a></li>
            </ul>
        </nav>
    </header>


    <div id="alertsPopup" class="alerts-popup" style="display: none;">
        <div class="popup-content">
            <h3>Alerts</h3>
            <p>No new alerts at the moment.</p>
            <button onclick="toggleAlertsPopup()" class="close-btn">Close</button>
        </div>
    </div>
    

    
    <main class="recommendations-container">
        <section class="recommendations-section">
            <h1>Job Recommendations</h1>

           
            <div id="recommendationsList" class="recommendations-list">
                <p>Loading recommendations based on your profile...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Job Application Tracker | All Rights Reserved</p>
    </footer>

    <script>
  
        function toggleAlertsPopup() {
            const popup = document.getElementById('alertsPopup');
            popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
        }

        
        document.addEventListener('DOMContentLoaded', function() {
        let username = localStorage.getItem('username');
        var request = new XMLHttpRequest();
        request.open("POST", "recommendedJobs.php", true);
        request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

        console.log("Sending request: ", "username=" + username);

        request.onreadystatechange = function () {
            if (this.readyState == 4 && this.status == 200) {
                console.log("Response received: ", this.responseText); 
                recommendedResponse(this.responseText);
            }
        };

        request.send("username=" + username);
    });

    function recommendedResponse(response) {
        var data = JSON.parse(response);
        const recommendationsList = document.getElementById('recommendationsList');
        recommendationsList.innerHTML = ''; // Clear the existing content

        if (data.success && data.jobs.length > 0) {
            data.jobs.forEach(job => {
                const jobDiv = document.createElement('div');
                jobDiv.classList.add('job-listing');

                // Job title
                const title = document.createElement('h2');
                title.textContent = job.title;
                jobDiv.appendChild(title);

                // Company
                const company = document.createElement('p');
                company.innerHTML = `<strong>Company:</strong> ${job.company}`;
                jobDiv.appendChild(company);

                // Location
                const location = document.createElement('p');
                location.innerHTML = `<strong>Location:</strong> ${job.locations}`;
                jobDiv.appendChild(location);

                // Description
                const description = document.createElement('p');
                description.innerHTML = `<strong>Description:</strong> ${job.description}`;
                jobDiv.appendChild(description);

                // Salary
                if (job.salary) {
                    const salary = document.createElement('p');
                    salary.innerHTML = `<strong>Salary:</strong> ${job.salary}`;
                    jobDiv.appendChild(salary);
                }

                // Link
                const link = document.createElement('a');
                link.href = job.url;
                link.target = '_blank';
                link.textContent = 'Apply Here';
                jobDiv.appendChild(link);

                // Append job listing to recommendations list
                recommendationsList.appendChild(jobDiv);
            });
        } else {
            recommendationsList.innerHTML = '<p>No job recommendations found. Please try again.</p>';
        }
    }
    </script>
</body>

</html>
