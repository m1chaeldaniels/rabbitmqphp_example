<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Jobs</title>
    <link rel="stylesheet" href="search_jobs.css">
</head>

<body>
    
    <header>
        <div class="logo">
            <h1>RMMY</h1>
        </div>
        <nav>
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="search_jobs.html">Search Jobs</a></li>
                <li><a href="#">Research Companies</a></li>
                <li><a href="#">Alerts</a></li>
                <li><a href="#">Logout</a></li>
            </ul>
        </nav>
    </header>

    
    <main class="search-container">
        <section class="search-section">
            <h1>Search for Jobs</h1>
            <form id="searchForm" onsubmit="event.preventDefault(); searchJobs();">
                <div class="form-group">
                    <label for="jobTitle">Job Title:</label>
                    <input type="text" id="jobTitle" placeholder="Enter job title">
                </div>

                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" placeholder="Enter location">
                </div>


                <button type="submit" class="search-btn">Search Jobs</button>
            </form>

            <div id="searchResults" class="search-results">
                <!-- when we have calls working it should go here  -->
                <p>No results to display yet. Start searching for jobs!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Job Application Tracker | All Rights Reserved</p>
    </footer>

    <script>
        // this is where variables for filters are set subject to change lmk
        let jobTitle = '';
        let location = '';
       
        
        function searchJobs() {
            
            jobTitle = document.getElementById('jobTitle').value;
            location = document.getElementById('location').value;
           
            
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = `
                <h2>Search Criteria:</h2>
                <p><strong>Job Title:</strong> ${jobTitle || 'N/A'}</p>
                <p><strong>Location:</strong> ${location || 'N/A'}</p>
               
            `;
        }
    </script>
</body>

</html>
