<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Recommendations</title>
    <link rel="stylesheet" href="recommendations.css">
</head>

<body>
    
    <header>
        <div class="logo">
            <h1>RMMY</h1>
        </div>
        <nav>
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="search_jobs.html">Search Jobs</a></li>
                <li><a href="companies.html">Research Companies</a></li>
                <li><a href="recommendations.html">Recommendations</a></li>
                <li><a href="#" onclick="toggleAlertsPopup()">Alerts</a></li>
                <li><a href="#">Logout</a></li>
            </ul>
        </nav>
    </header>


    <div id="alertsPopup" class="alerts-popup" style="display: none;">
        <div class="popup-content">
            <h3>Alerts</h3>
            <p>No new alerts at the moment.</p>
            <button onclick="toggleAlertsPopup()" class="close-btn">Close</button>
        </div>
    </div>
    

    
    <main class="recommendations-container">
        <section class="recommendations-section">
            <h1>Job Recommendations</h1>

           
            <div id="recommendationsList" class="recommendations-list">
                <p>Loading recommendations based on your profile...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Job Application Tracker | All Rights Reserved</p>
    </footer>

    <script>
  
        function toggleAlertsPopup() {
            const popup = document.getElementById('alertsPopup');
            popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
        }

        
        function loadRecommendations() {
            const recommendationsList = document.getElementById('recommendationsList');
            const recommendations = [
                {
                    title: 'Software Developer at Innovatech',
                    location: 'Austin, TX',
                    industry: 'Technology',
                    requirements: 'JavaScript, HTML, CSS, React',
                },
                {
                    title: 'Data Scientist at DataWorks',
                    location: 'Boston, MA',
                    industry: 'Finance',
                    requirements: 'Python, R, SQL, Machine Learning',
                },
                {
                    title: 'Product Manager at MarketMinds',
                    location: 'San Francisco, CA',
                    industry: 'Marketing',
                    requirements: 'Agile, UX/UI, Product Design',
                },
            ];

           
            setTimeout(() => {
                recommendationsList.innerHTML = recommendations.map(job => `
                    <div class="job-listing">
                        <h2>${job.title}</h2>
                        <p><strong>Location:</strong> ${job.location}</p>
                        <p><strong>Industry:</strong> ${job.industry}</p>
                        <p><strong>Requirements:</strong> ${job.requirements}</p>
                    </div>
                `).join('');
            }, 2000); // 2-second delay for simulation
        }

       
        window.onload = loadRecommendations;
    </script>
</body>

</html>
